<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You've Got Mail! 💌</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <p class="hint">💌 Something special inside? Tap to open!</p>
    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope">
        <div class="flap"></div>
        <div class="letter">
          <div class="letter-content">
            <h3>Dear Amazing Person 🌸</h3>
            <p> ไม่มีอะไรหรอกจร้า โดนหลอกแร้ว </p>
            <span class="sign">From AtomKonsuay ✨</span>
          </div>
        </div>
        <div class="pocket"></div>
        <div class="heart">💖</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
